# 服务名 / 容器名 = omnigate-panel。
#
# 单二进制：内置 OmniGate 引擎 + Web 面板，不再有 auths/ 账号目录或独立工具二进制。
# 首次启动前复制 bootstrap 配置并填写 PostgreSQL DSN：
#   cp config.example.json config.json
# config.json 只保存数据库连接；供应商、路由、面板账号等全部在 PostgreSQL 中。
services:
  omnigate-panel:
    build: .
    container_name: omnigate-panel
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致写盘失败：
    #   1) 让容器以你自己的 uid 运行：PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #   2) sudo chown -R 10001:10001 ./data ./config.json
    #   3) user: "0:0"（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./data:/app/data
      # 宿主机必须先有 config.json（cp config.example.json config.json）。
      # 只含 storage.dsn；配置保存不会写这个文件。
      - ./config.json:/app/config.json
